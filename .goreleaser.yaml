# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: twee

before:
  hooks:
    - make libghostty

builds:
  - id: twee
    main: ./cmd/twee
    binary: twee
    targets:
      - linux_amd64_v1
    tags:
      - static
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - id: twee
    ids:
      - twee
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}
    files:
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: paulsmith
    name: twee
  prerelease: auto
  mode: keep-existing
