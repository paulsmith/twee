name: release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".goreleaser.yaml"
      - "CMakeLists.txt"
      - "flake.lock"
      - "flake.nix"
      - "Makefile"
      - "cmd/**"
      - "go.*"
      - "internal/**"
      - "tuitest/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64_v1
            asset_suffix: linux_amd64
          - os: macos-14
            target: darwin_arm64
            asset_suffix: darwin_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check GoReleaser config
        run: nix develop --impure --command goreleaser check

      - name: Build archive
        env:
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          args=(build --single-target --clean --output dist/twee)
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="snapshot"
            args+=(--snapshot)
          fi

          TARGET="${TARGET}" nix develop --impure --command goreleaser "${args[@]}"

          mkdir -p release
          tar -C dist -czf "release/twee_${version}_${ASSET_SUFFIX}.tar.gz" twee -C "${GITHUB_WORKSPACE}" README.md

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Write checksums
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          cd release-assets
          shasum -a 256 *.tar.gz > "twee_${version}_checksums.txt"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            prerelease=()
            if [[ "${tag}" == *-* ]]; then
              prerelease+=(--prerelease)
            fi

            gh release create "${tag}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${tag}" \
              --generate-notes \
              "${prerelease[@]}"
          fi
